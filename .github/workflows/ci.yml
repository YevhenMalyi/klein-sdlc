name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only the free tier runs here. The eval tiers spawn real Claude sessions and, in CI, can
# only authenticate with an API key billed per token; they run locally on a subscription
# instead — `npm run eval:trigger` and `npm run eval:scenario`, see README § Evals and tests.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:schema
